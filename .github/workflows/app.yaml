name: Nodejs app deployment

on:
  push:
    branches:
        -  test
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4
    - name: setup node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: install dependencies
      working-directory: ./cicd-hands-on/app
      run: npm ci
    - name: run tests
      working-directory: ./cicd-hands-on/app
      run: npm test

