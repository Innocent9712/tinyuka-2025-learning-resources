name: Nodejs app deployment

on:
  push:
    branches:
      - test
      - master # Triggers when a PR is merged into master
  pull_request:
    branches:
      - master # Triggers when a PR is opened/updated against master

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cicd-hands-on/app # Simplifies repetitive working-directory fields
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Automatically caches node_modules for faster runs
          cache-dependency-path: ./cicd-hands-on/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: check secrets and variables
        run: |
          echo "some secret: ${{secrets.MY_SECRET}}"
          echo "some variable: ${{vars.MY_VARIABLE}}"

  deploy:
    needs: test
    # Only run deploy if the event is a push to the master branch (which includes PR merges)
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cicd-hands-on/app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./cicd-hands-on/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup server environment
        run: echo "server is ready"

      - name: Deploy to server
        # NOTE: If 'npm run start' starts a permanent server, this step will hang.
        # Consider replacing this with an actual deployment sync command (e.g., rsync, docker push, ssh broadcast)
        run: echo "server deployed"

      - name: Validate that the app runs fine
        run: echo "app has started successfully"